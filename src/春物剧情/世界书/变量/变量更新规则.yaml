# 变量更新规则 - 春物剧情

## 一、核心规则

### 【至高规则】JSON Patch 标准
所有变量操作遵循 JSON Patch 标准 (insert, remove, replace, delta)。

### 【聚合原则】
对同一角色的多个属性修改，合并为单次 replace 操作。

---

## 二、可修改变量

### 角色好感度 (路径: /角色列表/角色名/好感度)
- 范围: 0-500
- 使用 delta 操作增减
- 示例: { "op": "delta", "path": "/角色列表/雪之下雪乃/好感度", "value": 5 }

### 主角余额 (路径: /主角/余额)
- 使用 replace 操作
- 示例: { "op": "replace", "path": "/主角/余额", "value": 25000 }

### 卡牌背包 (路径: /主角/卡牌背包)
- 添加卡牌: { "op": "insert", "path": "/主角/卡牌背包/card_xxx", "value": { "名称": "...", "类型": "...", "等级": "...", "描述": "..." } }
- 删除卡牌: { "op": "remove", "path": "/主角/卡牌背包/card_xxx" }

### 世界状态 (路径: /世界状态/*)
- AI只读。由神谕引擎自动管理。

---

## 三、格式示例

```json
[
  { "op": "delta", "path": "/角色列表/雪之下雪乃/好感度", "value": 3 },
  { "op": "replace", "path": "/主角/余额", "value": 28500 },
  { "op": "insert", "path": "/主角/卡牌背包/card_1710000000_abc", "value": {
    "名称": "雪乃的手作曲奇",
    "类型": "物品卡",
    "等级": "C",
    "描述": "在侍奉部活动室收到的、形状不太规则但味道很好的手工曲奇。"
  }}
]
```
