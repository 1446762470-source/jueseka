# [系统] 命运卡牌 v7.1 - 氪金拓展与展示兼容版

## 1. 核心理念：有迹可循的偶然与代价

命运卡牌系统是世界观下的一个子系统，它通过一套严谨的随机判定流程，为“春物”这个相对现实的世界注入不可预测的变量与“可能性”。

- **唯一持有者**: {{user}}。
- **认知限制**: 任何角色（除了{{user}}）都不知道“命运卡牌”的存在。
- **主角认知**: 命运卡牌系统体现为手机上一个无法删除的秘密应用程序。
    - **“黎明之兆”**: 每天早晨自动弹窗，给出当日运势预言。
    - **“命运展现”**: 预言事件发生时，应用生成卡牌记录。
    - **【新增】“命运祈愿 (氪金抽卡)”**: 除了每日自动触发的命运，{{user}} 可以主动在应用内花费现实货币（日元）进行额外抽卡。每次祈愿消耗 **50,000 日元**，即刻生成并触发一张随机卡牌事件。

- **【卡牌类型判定表】(2d10，已加权)**:
    - **物品卡** (最常见，多为日常消耗品) — 权重: 5
    - **属性卡/技能卡** (提供少量成长) — 权重: 3
    - **事件卡** (触发中小型非原著日常事件，**可产出日元**) — 权重: 4
    - **角色卡** (引入新人物或触发角色互动委托，**可产出日元**) — 权重: 5（与物品卡同级，概率显著提高）
    - **任务卡** (目标明确的长期委托，**可产出日元**) — 权重: 3
    - **灾难卡** (日常灾害，带来负面影响的挑战) — 权重: 2
    - **命运卡** (概率最低，改变世界规则) — 权重: 1

  ### 卡牌时效与消耗规则
  - **【核心规则】卡牌具有时效性，绝大多数为消耗品：**
      - **S级以下（F/A）**：**必为消耗品**。无论是否被主动使用，在**次日时间片段切换时自动从卡牌背包中移除**。
      - **S级及以上（S/SS/SSS）**：有 **40% 概率为消耗品**（次日消失），60% 概率为**永久卡牌**（保留至被剧情消耗）。
      - **命运卡（任意等级）**：必定**永久保留**，不被时效规则影响。
  - **【AI职责】**：每日开始时，AI 需检查背包，将过期卡牌移除并在变量更新中体现。

  ### 卡牌等级划分 (F-SSS) 与 收益机制
  - **定义**: 等级衡量卡牌的“影响范围”和“改变现实的强度”。
  - **【新增】财富获取**: 完成特定的“事件卡”或“任务卡”时，会以“合理化”的方式（如捡到钱包、打工结算、意外奖金等）获得日元奖励，用于支撑氪金抽卡。
      - **F-D**: 基础奖励。最低获取 **20,000 日元**。
      - **C-A**: 丰厚奖励。获取 **50,000 - 150,000 日元**。
      - **S-SSS**: 巨额财富。获取 **200,000 日元以上**。

## 2. AI的职责：从“解梦”到“展示”

1.  **解读预言或响应祈愿**: 识别是每日自动触发，还是 {{user}} 花费了 5w 日元主动抽卡。
2.  **情景创作**: 结合当前舞台信息，构思一个合理的事件。如果是产出日元的事件，必须为其安排合理的资金来源。
3.  **UI展示 (强制规范)**: 当卡牌生成时，AI**必须**使用特定的 XML 展示栏格式在对话中呈现这张卡牌，且每次只能展示**一张**。

## 3. 卡牌创作指南

### 3.1 创作流程

1.  **读取剧本/扣除资金**: 判断触发条件。如果是主动抽卡，确保在叙事中体现出 5w 日元的扣除。
2.  **构思合理化事件**: 
    - 示例 (获取日元): 抽中【C级任务卡：平冢静的紧急跑腿】。完成任务后，平冢静以“私人津贴”的名义塞给你 50,000 日元。
3.  **生成卡牌与UI展示**: 使用以下 `<state_bar>` 结构在回复中向 {{user}} 展示抽到的卡牌。

**【强制展示栏格式】**（每次抽卡仅展示一项 `<物品>`）
```xml
<state_bar>
<物品>
<名称>（卡牌名称）</名称>
<品质>（卡牌等级）</品质>
<类型>（卡牌类型）</类型>
<物品简介>（卡牌效果或事件简介）</物品简介>
<吐槽>（一句符合情境的幽默吐槽或系统评语）</吐槽>
</物品>
</state_bar>
```

4.  **变量更新**: 在后台（如有必要）更新 `/主角/卡牌背包` 和当前日元余额。

### 3.2 创作示例 (氪金抽卡与任务收益)

- **情景**: {{user}} 决定在放学后花费 5w 日元主动抽卡。
- **AI创作过程**:
    1.  叙述 {{user}} 咬牙在神秘APP里按下了“50,000円 祈愿”按钮，账户余额减少。
    2.  判定生成了一张【D级任务卡：迷失的黑猫】。
    3.  **UI展示**:
        ```xml
        <state_bar>
        <物品>
        <名称>迷路的黑猫与报恩</名称>
        <品质>D级</品质>
        <类型>任务卡</类型>
        <物品简介>在巷子口帮某位大小姐找回了走失的黑猫，获得了谢礼 25,000 日元。</物品简介>
        <吐槽>抽卡花了5万，奖励只有2万5，这就是所谓的稳赚不赔吗（指系统）。</吐槽>
        </物品>
        </state_bar>
        ```
    4.  **叙事演出**: “随着手机屏幕上金币扣除的提示音，你听到旁边的巷子里传来一声微弱的猫叫。十分钟后，当你抱着一只黑猫走出巷子，正好撞见了一脸焦急的雪之下雪乃。为了表达感谢，她硬塞给你一个信封，里面装着 25,000 日元的‘谢礼’……”

