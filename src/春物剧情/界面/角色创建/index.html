<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>春物 — 角色创建</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:1rem;
  background:linear-gradient(180deg,#c9ddf5 0%,#d4e2f5 30%,#e8e0f0 60%,#f5d0d8 100%);
}

/* ===== 全屏开场页 ===== */
#welcome{
  position:fixed;inset:0;z-index:9999;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,#c9ddf5 0%,#d4e2f5 25%,#e0d8f0 55%,#f0c8d8 80%,#f5b8c8 100%);
}
#welcome.hide{opacity:0;pointer-events:none;transition:opacity 1s ease}


/* 樱花 */
.petals{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.petal{
  position:absolute;top:-20px;
  background:radial-gradient(ellipse at 30% 30%,rgba(255,210,220,.85),rgba(255,180,200,.4) 45%,rgba(255,160,180,0) 70%);
  border-radius:50% 0 50% 50%;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  8%{opacity:.8}
  80%{opacity:.25}
  100%{transform:translate(-30px,500px) rotate(380deg);opacity:0}
}

/* 标题 */
.hero{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.hero h1{
  font-size:clamp(1.4rem,3.8vw,2.4rem);font-weight:900;letter-spacing:clamp(3px,.8vw,6px);line-height:1.7;
  background:linear-gradient(135deg,#7cb8d0,#6ba0c0,#b890a8,#d498a8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;filter:drop-shadow(0 2px 4px rgba(150,140,170,.15));
}
.hero p{
  font-size:clamp(.7rem,1.5vw,.85rem);color:rgba(120,140,160,.3);
  margin:clamp(6px,1vw,12px) 0 clamp(24px,4vw,40px);letter-spacing:clamp(3px,.5vw,6px);
}
.hero button{
  padding:clamp(9px,1.8vw,13px) clamp(30px,5vw,48px);border-radius:24px;border:none;
  background:linear-gradient(135deg,rgba(120,160,190,.65),rgba(160,130,170,.65));
  color:#fff;font-size:clamp(.85rem,1.8vw,1.1rem);font-weight:700;letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 16px rgba(140,160,190,.25);transition:all .3s;font-family:inherit;
}
.hero button:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(140,160,190,.4)}

/* ===== 表单卡片 ===== */
.card{
  position:relative;z-index:1;
  width:min(92%,520px);padding:clamp(28px,5vw,56px) clamp(18px,3vw,32px);border-radius:12px;
  background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.4);box-shadow:0 4px 32px rgba(100,120,150,.08);
}
.card h2{
  text-align:center;
  font-size:clamp(1rem,2.5vw,1.3rem);font-weight:800;margin-bottom:clamp(24px,4vw,40px);
  background:linear-gradient(135deg,#7cb8d0,#b890a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.fg{margin-bottom:clamp(16px,3vw,28px)}
.fg label{display:block;font-size:clamp(.75rem,1.6vw,.9rem);color:rgba(80,80,100,.5);margin-bottom:clamp(4px,1vw,8px);font-weight:600}
.fg input,.fg select{
  width:100%;padding:clamp(10px,2vw,16px) clamp(10px,2vw,16px);border:1px solid rgba(180,190,200,.4);
  background:rgba(255,255,255,.6);border-radius:8px;font-size:clamp(.82rem,1.8vw,1rem);
  font-family:inherit;color:#334;outline:none;box-sizing:border-box;transition:border .2s;
}
.fg input:focus,.fg select:focus{border-color:rgba(140,180,200,.7);box-shadow:0 0 0 3px rgba(160,190,210,.15)}

.btn{
  width:100%;padding:clamp(10px,1.5vw,14px);border-radius:8px;border:none;font-family:inherit;
  font-size:clamp(.85rem,1.8vw,1rem);font-weight:700;cursor:pointer;transition:all .2s;
  background:linear-gradient(135deg,#7cb8d0,#6ea8b8);color:#fff;margin-top:6px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(120,170,190,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(70,100,120,.9);color:#fff;padding:10px 20px;border-radius:10px;
  font-weight:600;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:99999;font-family:inherit;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="welcome">
  <div class="petals" id="petals"></div>
  <div class="hero">
    <h1>やはり俺の<br>青春ラブコメは<br>まちがっている。</h1>
    <p>MY YOUTH ROMANTIC COMEDY IS WRONG, AS I EXPECTED</p>
    <button>开始游玩</button>
  </div>
</div>

<div class="card">
  <h2>入学登记</h2>
  <div class="fg"><label>姓名</label><input id="name" placeholder="你的名字" maxlength="10"></div>
  <div class="fg"><label>年龄</label><input id="age" type="number" value="17" min="15" max="20"></div>
  <div class="fg"><label>性别</label><select id="gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
  <div class="fg"><label>身份</label><select id="role"><option value="">请选择</option><option value="总武高高二J班学生">J班（雪乃）</option><option value="总武高高二F班学生">F班（八幡·结衣）</option><option value="总武高高二C班学生">C班（彩加）</option></select></div>
  <div class="fg"><label>特长</label><input id="talent" placeholder="如：洞察人心、文学创作" maxlength="20"></div>
  <button class="btn" id="btn-send">开始故事</button>
</div>

<div id="toast"></div>

<script>
(function(){
function $(id){return document.getElementById(id)}
function toast(m,d){
  var t=$('toast');t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},d||2000);
}

// 樱花花瓣
var pc=$('petals');
for(var i=0;i<24;i++){
  var p=document.createElement('div');p.className='petal';
  p.style.left=Math.random()*100+'%';
  p.style.animationDelay=Math.random()*8+'s';
  p.style.animationDuration=(3.5+Math.random()*5)+'s';
  p.style.width=(5+Math.random()*10)+'px';p.style.height=p.style.width;
  pc.appendChild(p);
}

// 关闭开场页
$('welcome').addEventListener('click',function(){
  this.classList.add('hide');
  setTimeout(function(){$('welcome').style.display='none'},1000);
});

$('btn-send').addEventListener('click',function(e){
  e.stopPropagation();
  var name=$('name').value.trim(),age=parseInt($('age').value)||17;
  var gender=$('gender').value,role=$('role').value,talent=$('talent').value.trim();
  if(!name){toast('请输入姓名');return}
  if(!gender){toast('请选择性别');return}
  if(!role){toast('请选择身份');return}
  if(!talent){toast('请输入特长');return}

  $('btn-send').disabled=true;$('btn-send').textContent='创建中...';

  try{
    var fn=(typeof insertOrAssignVariables==='function')?insertOrAssignVariables:(typeof parent!=='undefined'?parent.insertOrAssignVariables:null);
    if(fn)fn({主角:{名称:name,个人信息:{性别:gender,年龄:age},身份:[{组织:'总武高等学校',职位:role}],属性:{特长:talent}}},{type:'character'});
  }catch(e){}

  var msg='开局设置 姓名:'+name+' 年龄:'+age+' 性别:'+gender+' 身份:'+role+' 特长:'+talent+'\\n请以轻小说《我的青春恋爱物语果然有问题》的世界观，为这位总武高中的学生创作专属开学第一天开场。';

  try{
    var ts=(typeof triggerSlash==='function')?triggerSlash:(typeof parent!=='undefined'?parent.triggerSlash:null);
    if(ts){ts('/send '+msg.replace(/\\n/g,'\\\\n'));toast('故事即将开始...',3000)}
    else{console.info('[春物]调试:',msg);toast('调试模式：已输出到控制台',3000)}
  }catch(e){
    console.error(e);toast('发送失败，请重试');
    $('btn-send').disabled=false;$('btn-send').textContent='开始故事';
  }
  setTimeout(function(){
    if($('btn-send').disabled){$('btn-send').disabled=false;$('btn-send').textContent='开始故事'}
  },3500);
});
})();
</script>
</body>
</html>
