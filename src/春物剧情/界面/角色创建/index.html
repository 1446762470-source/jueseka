<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>春物 — 入学登记</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#c5dbe8 0%,#b0c8da 20%,#9ab5c9 40%,#7a9eb2 60%,#5c8799 80%,#4a7385 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem
}
.card{max-width:400px;width:100%;padding:28px 24px;border-radius:18px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 40px rgba(0,0,0,.15)}
.title{text-align:center;font-size:1.4rem;font-weight:900;letter-spacing:3px;
  color:#2c4a5a;margin-bottom:3px}
.sub{text-align:center;font-size:.7rem;color:rgba(60,80,100,.55);margin-bottom:22px;letter-spacing:2px}
.step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.dot.active{background:rgba(60,110,130,.7);box-shadow:0 0 6px rgba(60,110,130,.4)}
.fg{margin-bottom:14px}
.lb{display:block;font-size:.7rem;color:rgba(40,60,80,.6);margin-bottom:3px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.inp{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.55);
  border-radius:10px;font-size:.9rem;font-family:inherit;color:#1a3040;outline:none;box-sizing:border-box;transition:border .2s}
.inp:focus{border-color:rgba(80,140,170,.6);box-shadow:0 0 10px rgba(80,140,170,.15)}
.inp::placeholder{color:rgba(60,100,120,.3)}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.3);
  color:rgba(40,70,90,.6);font-size:.78rem;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit}
.opt:hover{background:rgba(255,255,255,.5);color:#1a3040}
.opt.active{background:rgba(90,150,180,.35);border-color:rgba(90,150,180,.5);color:#1a3040;font-weight:700}
.opt-custom{display:none;margin-top:6px}
.page{display:none}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-family:inherit;font-size:.9rem;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:all .2s}
.btn-next{background:linear-gradient(135deg,#5c8fa0,#3d6a7a);color:#fff;box-shadow:0 3px 16px rgba(60,110,130,.3)}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 5px 24px rgba(60,110,130,.4)}
.btn-next:active{transform:scale(.98)}
.btn-back{background:rgba(255,255,255,.3);color:#2c4a5a;border:1px solid rgba(255,255,255,.2)}
.btn-back:hover{background:rgba(255,255,255,.45)}
.btn-start{background:linear-gradient(135deg,#4a8a6a,#2d6048);color:#fff;box-shadow:0 3px 16px rgba(60,130,90,.3)}
.btn-start:hover{transform:translateY(-1px);box-shadow:0 5px 24px rgba(60,130,90,.4)}
.btn-start:active{transform:scale(.98)}
.btn:disabled{opacity:.5;pointer-events:none}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(40,80,100,.9);color:#fff;padding:12px 24px;border-radius:10px;
  font-weight:700;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
  text-align:center;max-width:300px;font-family:inherit}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
<div class="title">—— 总武高中 · 入学登记 ——</div>
<div class="sub">やはり俺の青春ラブコメはまちがっている。</div>
<div class="step-dots"><div class="dot active" id="dot1"></div><div class="dot" id="dot2"></div></div>

<!-- Page 1: 出身设定 -->
<div class="page active" id="page1">
<div class="fg"><label class="lb">姓名</label><input class="inp" id="name" placeholder="你的名字" maxlength="10"></div>
<div class="fg"><label class="lb">年龄</label><input class="inp" id="age" type="number" value="17" min="15" max="20"></div>
<div class="fg"><label class="lb">性别</label>
<div class="opts" id="opt-gender">
<button class="opt" data-v="男">♂ 男</button><button class="opt" data-v="女">♀ 女</button><button class="opt" data-v="__c__">⚧ 自定义</button>
</div><input class="inp opt-custom" id="gender-custom" placeholder="自定义性别" maxlength="10"></div>
<div class="fg"><label class="lb">身份</label>
<div class="opts" id="opt-role">
<button class="opt" data-v="总武高高二J班学生">J班（雪乃）</button><button class="opt" data-v="总武高高二F班学生">F班（八幡·结衣）</button><button class="opt" data-v="总武高高二C班学生">C班（彩加）</button><button class="opt" data-v="__c__">✎ 自定义</button>
</div><input class="inp opt-custom" id="role-custom" placeholder="自定义身份，如：总武高教师..." maxlength="30"></div>
<div class="btn-row"><button class="btn btn-next" id="btn-next">下一页 →</button></div>
</div>

<!-- Page 2: 开始 -->
<div class="page" id="page2">
<div class="fg"><label class="lb">📅 故事开始日期</label><input class="inp" id="date" type="date" value="2012-04-08" min="2012-04-08" max="2014-01-01"></div>
<div class="fg"><label class="lb">自定义场景（可选）</label><textarea class="inp" id="scene" rows="3" placeholder="描述你想要的开局…" style="resize:vertical"></textarea></div>
<div class="btn-row">
<button class="btn btn-back" id="btn-back">← 返回</button>
<button class="btn btn-start" id="btn-start">开始故事</button>
</div>
</div>

</div>
<div id="toast"></div>

<script>
(function(){
var sel={gender:'',role:''},currentPage=1;
function $(id){return document.getElementById(id)}

function toast(msg,ms){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},ms||2000);
}
function goPage(n){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  $('page'+n).classList.add('active');
  $('dot1').classList.toggle('active',n===1);
  $('dot2').classList.toggle('active',n===2);
  currentPage=n;
}

document.querySelectorAll('.opts').forEach(function(g){g.addEventListener('click',function(e){
  if(!e.target.classList.contains('opt'))return;
  var b=e.target,v=b.dataset.v,pid=g.id;
  g.querySelectorAll('.opt').forEach(function(x){x.classList.remove('active')});
  b.classList.add('active');
  if(pid==='opt-gender'){sel.gender=v;$('gender-custom').style.display=v==='__c__'?'block':'none';if(v==='__c__')$('gender-custom').focus()}
  if(pid==='opt-role'){sel.role=v;$('role-custom').style.display=v==='__c__'?'block':'none';if(v==='__c__')$('role-custom').focus()}
})});

$('btn-next').addEventListener('click',function(){
  var name=$('name').value.trim();
  var age=parseInt($('age').value)||17;
  if(!name){toast('请输入姓名');return}
  if(sel.gender==='__c__'){sel.gender=$('gender-custom').value.trim();if(!sel.gender){toast('请输入性别');return}}
  if(!sel.gender){toast('请选择性别');return}
  if(sel.role==='__c__'){sel.role=$('role-custom').value.trim();if(!sel.role){toast('请输入身份');return}}
  if(!sel.role){toast('请选择班级');return}
  sel._name=name;sel._age=age;
  goPage(2);
});

$('btn-back').addEventListener('click',function(){goPage(1)});

$('btn-start').addEventListener('click',function(){
  $('btn-start').textContent='创建中...';$('btn-start').disabled=true;
  var date=$('date').value||'2012-04-08';
  var scene=$('scene').value.trim();

  try{
    if(typeof insertOrAssignVariables==='function'){
      insertOrAssignVariables({
        主角:{名称:sel._name,个人信息:{性别:sel.gender,年龄:sel._age},身份:[{组织:'总武高等学校',职位:sel.role}]}
      },{type:'character'});
    }
  }catch(e){}

  var msg='开局设置\\n姓名:'+sel._name+' 年龄:'+sel._age+' 性别:'+sel.gender+' 身份:'+sel.role+'\\n日期:'+date;
  if(scene)msg+='\\n场景补充:'+scene;
  msg+='\\n请以轻小说《我的青春恋爱物语果然有问题》的世界观和文风，为这位总武高中的学生创作一个专属的开学第一天开场。';

  if(typeof triggerSlash==='function'){triggerSlash('/send '+msg.replace(/\\n/g,'\\\\n'))}
  toast('故事即将开始...',3000);
  setTimeout(function(){$('btn-start').textContent='开始故事';$('btn-start').disabled=false},3500);
});
})();
</script>
</body>
</html>
