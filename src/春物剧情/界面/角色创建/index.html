<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>春物 — 角色创建</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:1rem;
  background:#f0f4f8;
}

/* 全屏覆盖层 */
#welcome{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#fff;cursor:pointer;
}
#welcome.hide{opacity:0;pointer-events:none;transition:opacity .8s ease}

#welcome h1{font-size:2rem;font-weight:700;color:#333;letter-spacing:3px;margin-bottom:10px}
#welcome p{font-size:1rem;color:#999;margin-bottom:28px}
#welcome button{
  padding:12px 42px;border-radius:6px;border:none;
  background:#5c8fa0;color:#fff;font-size:1rem;font-weight:700;
  cursor:pointer;font-family:inherit;
}

/* 表单卡片 */
.card{
  width:100%;max-width:480px;padding:28px 24px;border-radius:10px;
  background:#fff;border:1px solid #dde4ed;
}
.card h2{text-align:center;font-size:1.2rem;font-weight:700;color:#333;margin-bottom:20px}

.fg{margin-bottom:16px}
.fg label{display:block;font-size:.85rem;color:#666;margin-bottom:4px;font-weight:600}
.fg input,.fg select{
  width:100%;padding:10px 12px;border:1px solid #dde4ed;
  background:#fff;border-radius:6px;font-size:.95rem;
  font-family:inherit;color:#333;outline:none;box-sizing:border-box;
}
.fg input:focus,.fg select:focus{border-color:#7cb8d0;box-shadow:0 0 0 2px rgba(124,184,208,.15)}

.btn{
  width:100%;padding:12px;border-radius:6px;border:none;font-family:inherit;
  font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;
  background:#5c8fa0;color:#fff;margin-top:6px;
}
.btn:hover{background:#4a7a8a}
.btn:disabled{opacity:.5;cursor:not-allowed}

#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;
  font-weight:600;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:99999;font-family:inherit;
}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="welcome">
  <h1>やはり俺の青春ラブコメはまちがっている。</h1>
  <p>点击任意位置进入</p>
  <button>开始游玩</button>
</div>

<div class="card">
  <h2>入学登记</h2>
  <div class="fg"><label>姓名</label><input id="name" placeholder="你的名字" maxlength="10"></div>
  <div class="fg"><label>年龄</label><input id="age" type="number" value="17" min="15" max="20"></div>
  <div class="fg"><label>性别</label><select id="gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
  <div class="fg"><label>身份</label><select id="role"><option value="">请选择</option><option value="总武高高二J班学生">J班（雪乃）</option><option value="总武高高二F班学生">F班（八幡·结衣）</option><option value="总武高高二C班学生">C班（彩加）</option></select></div>
  <div class="fg"><label>特长</label><input id="talent" placeholder="如：洞察人心、文学创作" maxlength="20"></div>
  <button class="btn" id="btn-send">开始故事</button>
</div>

<div id="toast"></div>

<script>
(function(){
function $(id){return document.getElementById(id)}
function toast(m,d){
  var t=$('toast');t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},d||2000);
}

$('welcome').addEventListener('click',function(){
  this.classList.add('hide');
  setTimeout(function(){$('welcome').style.display='none'},800);
});

$('btn-send').addEventListener('click',function(e){
  e.stopPropagation();
  var name=$('name').value.trim(),age=parseInt($('age').value)||17;
  var gender=$('gender').value,role=$('role').value,talent=$('talent').value.trim();
  if(!name){toast('请输入姓名');return}
  if(!gender){toast('请选择性别');return}
  if(!role){toast('请选择身份');return}
  if(!talent){toast('请输入特长');return}

  $('btn-send').disabled=true;$('btn-send').textContent='创建中...';

  try{
    var fn=(typeof insertOrAssignVariables==='function')?insertOrAssignVariables:(typeof parent!=='undefined'?parent.insertOrAssignVariables:null);
    if(fn)fn({主角:{名称:name,个人信息:{性别:gender,年龄:age},身份:[{组织:'总武高等学校',职位:role}],属性:{特长:talent}}},{type:'character'});
  }catch(e){}

  var msg='开局设置 姓名:'+name+' 年龄:'+age+' 性别:'+gender+' 身份:'+role+' 特长:'+talent+'\\n请以轻小说《我的青春恋爱物语果然有问题》的世界观，为这位总武高中的学生创作专属开学第一天开场。';

  try{
    var ts=(typeof triggerSlash==='function')?triggerSlash:(typeof parent!=='undefined'?parent.triggerSlash:null);
    if(ts){ts('/send '+msg.replace(/\\n/g,'\\\\n'));toast('故事即将开始...',3000)}
    else{console.info('[春物]调试:',msg);toast('调试模式：已输出到控制台',3000)}
  }catch(e){
    console.error(e);toast('发送失败，请重试');
    $('btn-send').disabled=false;$('btn-send').textContent='开始故事';
  }
  setTimeout(function(){
    if($('btn-send').disabled){$('btn-send').disabled=false;$('btn-send').textContent='开始故事'}
  },3500);
});
})();
</script>
</body>
</html>
