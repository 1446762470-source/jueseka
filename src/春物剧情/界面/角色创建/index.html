<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>春物</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}

/* Welcome screen - full page */
#welcome{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#c9ddf5,#d4e2f5,#e0d8f0,#f0c8d8,#f5b8c8);
  background-image:linear-gradient(180deg,#c9ddf5,#d4e2f5,#e0d8f0,#f0c8d8),radial-gradient(ellipse at 20% 80%,rgba(255,200,220,.15),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(180,210,240,.12),transparent 50%);cursor:pointer;overflow:hidden}

/* Gate background - fills entire welcome */
.gate{position:absolute;inset:0;pointer-events:none}
.gate-pillar{position:absolute;bottom:0;left:20%;width:12%;height:65%;background:linear-gradient(180deg,#a08c78,#7a6854);border-radius:4px 4px 0 0;box-shadow:3px 0 10px rgba(0,0,0,.1)}
.gate-pillar.r{left:auto;right:20%}
.gate-arch{position:absolute;top:22%;left:14%;right:14%;height:10%;border:8px solid #a08c78;border-bottom:none;border-radius:18px 18px 0 0}
.gate-arch span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#a08c78;font-weight:900;letter-spacing:6px;white-space:nowrap}
.gate-wall{position:absolute;bottom:0;left:0;right:0;height:28%;background:linear-gradient(180deg,rgba(250,245,240,.6),rgba(240,230,220,.65))}

/* Cherry petals */
.petals{position:fixed;top:0;left:0;right:0;height:20vh;z-index:2;pointer-events:none}
.petal{position:absolute;top:-20px;background:radial-gradient(circle at 30% 30%,rgba(255,220,230,.85),rgba(255,190,210,.45) 40%,rgba(255,170,190,0) 70%);border-radius:50% 0 50% 50%;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg);opacity:0}10%{opacity:.75}85%{opacity:.35}100%{transform:translate(-40px,22vh) rotate(400deg);opacity:0}}

/* Content on top of gate */
.content{position:relative;z-index:3;text-align:center}
.title{font-size:1.6rem;font-weight:900;letter-spacing:4px;line-height:1.8;
  background:linear-gradient(135deg,#6ba8d0,#8ba8c8,#b898b8,#d498a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:.6rem;color:rgba(120,140,160,.45);margin:8px 0 20px;letter-spacing:4px}
.btn{display:inline-block;padding:10px 38px;border-radius:30px;border:none;
  background:linear-gradient(135deg,rgba(120,160,190,.7),rgba(160,130,170,.7));color:#fff;font-size:.95rem;font-weight:700;
  letter-spacing:2px;cursor:pointer;box-shadow:0 4px 20px rgba(140,160,190,.3);transition:all .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(140,160,190,.45)}

/* Form page */
#form-page{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:16px;
  background:linear-gradient(180deg,#c5dbe8,#b0c8da,#9ab5c9,#7a9eb2,#5c8799,#4a7385)}
#form-page.show{display:flex;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.card{width:88%;max-width:320px;padding:20px 16px;border-radius:14px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15)}
.card h2{text-align:center;font-size:1rem;font-weight:800;color:#2c4a5a;margin-bottom:14px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.65rem;color:rgba(40,60,80,.55);margin-bottom:2px;font-weight:600;letter-spacing:.5px}
.fg input,.fg textarea{width:100%;padding:8px 10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.5);border-radius:6px;font-size:.8rem;font-family:inherit;color:#1a3040;outline:none;box-sizing:border-box}
.fg input:focus{border-color:rgba(80,140,170,.5)}
.fg input::placeholder{color:rgba(60,100,120,.25)}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opts button{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.3);color:rgba(40,70,90,.55);font-size:.7rem;cursor:pointer;transition:all .15s;font-weight:500;font-family:inherit}
.opts button:hover{background:rgba(255,255,255,.5)}
.opts button.sel{background:rgba(90,150,180,.35);border-color:rgba(90,150,180,.5);color:#1a3040;font-weight:700}
.opt-custom{display:none;margin-top:4px}
.btn-submit{width:100%;padding:10px;border-radius:8px;border:none;font-family:inherit;font-size:.85rem;font-weight:700;
  letter-spacing:1px;cursor:pointer;background:linear-gradient(135deg,#5c8fa0,#3d6a7a);color:#fff;margin-top:4px}
.btn-submit:disabled{opacity:.5}

#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(40,80,100,.9);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;text-align:center;font-family:inherit}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="welcome">
  <div class="petals" id="petals"></div>
  <div class="gate">
    <div class="gate-pillar"></div><div class="gate-pillar r"></div>
    <div class="gate-arch"><span>総武高等学校</span></div>
    <div class="gate-wall"></div>
  </div>
  <div class="content">
    <div class="title">やはり俺の<br>青春ラブコメは<br>まちがっている。</div>
    <div class="sub">MY YOUTH ROMANTIC COMEDY IS WRONG, AS I EXPECTED</div>
    <button class="btn" id="btn-start">开始游玩</button>
  </div>
</div>

<div id="form-page">
  <div class="card">
    <h2>—— 入学登记 ——</h2>
    <div class="fg"><label>姓名</label><input id="name" placeholder="你的名字" maxlength="10"></div>
    <div class="fg"><label>年龄</label><input id="age" type="number" value="17" min="15" max="20"></div>
    <div class="fg"><label>性别</label>
      <div class="opts" id="opt-gender">
        <button data-v="男">♂ 男</button><button data-v="女">♀ 女</button><button data-v="__c__">自定义</button>
      </div><input class="opt-custom" id="gender-custom" placeholder="自定义性别" maxlength="10">
    </div>
    <div class="fg"><label>身份</label>
      <div class="opts" id="opt-role">
        <button data-v="总武高高二J班学生">J班（雪乃）</button><button data-v="总武高高二F班学生">F班（八幡·结衣）</button><button data-v="总武高高二C班学生">C班（彩加）</button><button data-v="__c__">自定义</button>
      </div><input class="opt-custom" id="role-custom" placeholder="自定义身份" maxlength="30">
    </div>
    <button class="btn-submit" id="btn-submit">开始故事</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
var sel={gender:'',role:''};
function $(id){return document.getElementById(id)}
function toast(m,d){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},d||2000)}

// Petals
var pc=$('petals');
for(var i=0;i<20;i++){
  var p=document.createElement('div');p.className='petal';
  p.style.left=Math.random()*100+'%';
  p.style.animationDelay=Math.random()*6+'s';
  p.style.animationDuration=(3+Math.random()*5)+'s';
  p.style.width=(6+Math.random()*10)+'px';p.style.height=p.style.width;
  pc.appendChild(p);
}

$('btn-start').addEventListener('click',function(){
  $('welcome').style.display='none';
  $('form-page').classList.add('show');
});

// Option buttons
document.querySelectorAll('.opts').forEach(function(g){g.addEventListener('click',function(e){
  if(!e.target.matches('button'))return;
  var b=e.target,v=b.dataset.v,pid=g.id;
  g.querySelectorAll('button').forEach(function(x){x.classList.remove('sel')});
  b.classList.add('sel');
  if(pid==='opt-gender'){sel.gender=v;$('gender-custom').style.display=v==='__c__'?'block':'none'}
  if(pid==='opt-role'){sel.role=v;$('role-custom').style.display=v==='__c__'?'block':'none'}
})});

$('btn-submit').addEventListener('click',function(){
  var name=$('name').value.trim(),age=parseInt($('age').value)||17;
  if(!name){toast('请输入姓名');return}
  if(sel.gender==='__c__'){sel.gender=$('gender-custom').value.trim();if(!sel.gender){toast('请输入性别');return}}
  if(!sel.gender){toast('请选择性别');return}
  if(sel.role==='__c__'){sel.role=$('role-custom').value.trim();if(!sel.role){toast('请输入身份');return}}
  if(!sel.role){toast('请选择班级');return}
  $('btn-submit').disabled=true;$('btn-submit').textContent='创建中...';

  try{var fn=(typeof parent.insertOrAssignVariables==='function')?parent.insertOrAssignVariables:insertOrAssignVariables;
    fn({主角:{名称:name,个人信息:{性别:sel.gender,年龄:age},身份:[{组织:'总武高等学校',职位:sel.role}]}},{type:'character'});}catch(e){}

  var msg='开局设置 姓名:'+name+' 年龄:'+age+' 性别:'+sel.gender+' 身份:'+sel.role+'\\n请以轻小说《我的青春恋爱物语果然有问题》的世界观，为这位总武高中的学生创作专属开学第一天开场。';
  try{var ts=(typeof parent.triggerSlash==='function')?parent.triggerSlash:triggerSlash;
    ts('/send '+msg.replace(/\\n/g,'\\\\n'));}catch(e){}

  toast('故事即将开始...',3000);
  setTimeout(function(){$('btn-submit').textContent='开始故事';$('btn-submit').disabled=false},3500);
});
})();
</script>
</body>
</html>
